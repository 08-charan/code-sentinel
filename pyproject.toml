[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-sentinel"
version = "0.1.0"
description = "A terminal-native AST code quality analyzer, complexity profiler, and AI evaluation engine."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lakavath Sai Charan", email = "saicharannaik2005@gmail.com"}
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "GitPython>=3.1.40",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "flake8>=6.1.0"
]

[project.scripts]
code-sentinel = "sentinel.cli:cli"
